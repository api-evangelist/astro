aid: astro
name: Astro
description: 'Astro (PT Astro Technologies Indonesia, astronauts.id) is an Indonesian
  quick-commerce grocery and daily-needs delivery service that fulfills orders in as
  little as fifteen minutes across the Greater Jakarta (Jadetabek) area. The consumer
  mobile app offers more than 15,000 SKUs spanning fresh produce, meat and seafood,
  frozen and prepared meals, beverages, snacks, baby and maternal care, personal care
  and beauty, household supplies, and the private-label Astro Goods line, operating
  24/7 from a network of dark stores. Astro is venture-backed by Accel, Lightspeed
  Venture Partners, and Redpoint Ventures. It is a consumer B2C app and publishes no
  public developer API; this API Evangelist profile tracks the company as a portfolio
  lead.'
